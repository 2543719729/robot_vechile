name: Repository checks

on:
  push:
    branches: [master, "docs/**"]
  pull_request:

jobs:
  metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run navigation-metrics unit tests
        run: python -m unittest discover -s tests -v
