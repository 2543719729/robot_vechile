local_costmap:
# ============================================================
# 局部代价地图 - 全面优化版
# 策略：robot_radius负责碰撞检测，inflation_radius提供安全缓冲
# ============================================================
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 10.0
  publish_frequency: 5.0
  rolling_window: true
  width: 2.0
  height: 2.0
  resolution: 0.05                   # 5cm分辨率
  transform_tolerance: 0.5
  
  # 膨胀层配置
  # 关键：inflation_radius < xy_goal_tolerance (0.08m)
  inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0         # 较快衰减，减少高代价区域
    inflation_radius: 0.05           # 5cm膨胀，小于xy_goal_tolerance

  plugins:
    - {name: obstacle_layer,        type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer,       type: "costmap_2d::InflationLayer"}
