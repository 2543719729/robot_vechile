local_costmap:
# ============================================================
# 局部代价地图 - 历史配置候选，待实测
# 策略：robot_radius负责碰撞检测，inflation_radius提供安全缓冲
# ============================================================
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 10.0
  publish_frequency: 5.0
  rolling_window: true
  width: 2.0
  height: 2.0
  resolution: 0.05                   # 5cm分辨率
  transform_tolerance: 0.5

  # 膨胀层配置
  # 膨胀半径与目标容差没有普适大小关系；当前小半径需实际验证
  inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0         # 较快衰减，减少高代价区域
    inflation_radius: 0.05           # 历史值 5cm；不代表可安全通过的间距

  plugins:
    - {name: obstacle_layer,        type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer,       type: "costmap_2d::InflationLayer"}
